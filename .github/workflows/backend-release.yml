name: Backend Release

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: Type the production Supabase project ref to confirm.
        required: true
        type: string
      canary_project_id:
        description: Existing internal funnel UUID used for the first historical backfill.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: backend-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Database, Functions, And Production Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: https://nztnctrkmfrgclrnflfa.supabase.co
      VITE_SUPABASE_URL: https://nztnctrkmfrgclrnflfa.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: nztnctrkmfrgclrnflfa
      PROBE_APP_URL: ${{ vars.APP_PUBLIC_URL }}
      APP_PUBLIC_URL: ${{ vars.APP_PUBLIC_URL }}

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7

      - name: Confirm production target
        run: |
          test -n "$SUPABASE_PROJECT_REF" || (echo "SUPABASE_PROJECT_REF variable is required" && exit 1)
          test "${{ inputs.confirm_project_ref }}" = "$SUPABASE_PROJECT_REF" || (echo "Production project confirmation does not match" && exit 1)
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "SUPABASE_ACCESS_TOKEN secret is required" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "SUPABASE_DB_PASSWORD secret is required" && exit 1)
          test -n "${{ secrets.RELEASE_AUTOMATION_KEY }}" || (echo "RELEASE_AUTOMATION_KEY secret is required" && exit 1)
          test -n "$APP_PUBLIC_URL" || (echo "APP_PUBLIC_URL variable is required" && exit 1)
          case "${{ inputs.canary_project_id }}" in
            ????????-????-????-????-????????????) ;;
            *) echo "canary_project_id must be a UUID"; exit 1 ;;
          esac

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Local release gates
        run: |
          npm run lint -- --quiet
          npx tsc --noEmit --pretty false
          npm test
          npm run build
          npm run check:migration-safety
          npm run check:secret-boundaries
          npm run check:function-manifest

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1

      - name: Link production database
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview database migration
        run: supabase db push --linked --dry-run | tee migration-dry-run.txt

      - name: Pause background jobs before database writes
        env:
          BACKGROUND_CRON_PRODUCTION_ACK: ${{ inputs.confirm_project_ref }}
        run: npm run ops:cron -- pause | tee background-cron-pause.json

      - name: Apply non-blocking production indexes
        run: |
          for migration in supabase/online-migrations/[0-9]*.sql; do
            echo "Applying $migration" | tee -a online-indexes.log
            supabase db query --linked --file "$migration" --output json | tee -a online-indexes.log
          done
          supabase db query --linked --file supabase/online-migrations/verify_backend_reliability_indexes.sql --output json | tee -a online-indexes.log

      - name: Apply database migrations
        run: supabase db push --linked

      - name: Lint deployed database contracts
        run: supabase db lint --linked --level error

      - name: Preserve production function URLs
        run: |
          supabase secrets set \
            APP_PUBLIC_URL="$APP_PUBLIC_URL" \
            CANARY_APP_URL="$APP_PUBLIC_URL" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy exact backend function inventory
        run: |
          node -e 'const m=require("./supabase/functions/deploy-manifest.json"); for (const name of m.expectedRemoteFunctions) console.log(name)' |
          while read -r function_name; do
            supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_REF" --use-api
          done

      - name: Verify function inventory
        run: npm run check:function-drift

      - name: Acquire masked backend key for release-only data repair
        run: |
          service_role_key="$(supabase projects api-keys \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --output json | jq -r 'map(select(.name == "service_role"))[0].api_key // empty')"
          test -n "$service_role_key" || (echo "service_role key was not returned" && exit 1)
          echo "::add-mask::$service_role_key"
          echo "SUPABASE_SERVICE_ROLE_KEY=$service_role_key" >> "$GITHUB_ENV"

      - name: Preview historical metrics backfill
        run: npm run ops:backfill-feedback-metrics | tee feedback-backfill-plan.json

      - name: Backfill and reconcile internal canary
        env:
          FEEDBACK_METRICS_BACKFILL_ACK: ${{ inputs.confirm_project_ref }}
          AUTOMATION_KEY: ${{ secrets.RELEASE_AUTOMATION_KEY }}
        run: |
          npm run ops:backfill-feedback-metrics -- \
            --project="${{ inputs.canary_project_id }}" \
            --execute | tee feedback-backfill-canary.json

      - name: Verify production RLS contracts
        env:
          RLS_MANAGEMENT_SESSION_ACK: ${{ inputs.confirm_project_ref }}
        run: node scripts/verify-rls-management-session.mjs | tee rls-contracts.json

      - name: Production canary
        run: npm run ops:probe | tee backend-canary.json

      - name: Resume background jobs after green gates
        id: resume_background_jobs
        env:
          BACKGROUND_CRON_PRODUCTION_ACK: ${{ inputs.confirm_project_ref }}
        run: npm run ops:cron -- resume | tee background-cron-resume.json

      - name: Post-resume canary
        run: npm run ops:probe | tee backend-canary-post-resume.json

      - name: Pause background jobs when post-resume canary fails
        if: ${{ failure() && steps.resume_background_jobs.outcome == 'success' }}
        env:
          BACKGROUND_CRON_PRODUCTION_ACK: ${{ inputs.confirm_project_ref }}
        run: npm run ops:cron -- pause

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-release-${{ github.sha }}
          path: |
            migration-dry-run.txt
            online-indexes.log
            background-cron-pause.json
            feedback-backfill-plan.json
            feedback-backfill-canary.json
            rls-contracts.json
            backend-canary.json
            background-cron-resume.json
            backend-canary-post-resume.json
          if-no-files-found: ignore
          retention-days: 30
